<svg width="600" height="280" viewBox="0 0 600 280" fill="none" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <style>
    .card-title { font: 700 16px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #00E5FF; }
    .card-badge { font: 600 11px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #8B949E; }
    .pill-label { font: 500 12px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #8B949E; }
    .pill-value { font: 700 14px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #C9D1D9; }
    .pill-accent { font: 700 14px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #00E5FF; }
    .bar-label { font: 500 11px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #8B949E; }
    .bar-val-label { font: 600 10px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #8B949E; opacity: 0.8; }
    .milestone-text { font: 500 11.5px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #C9D1D9; }
    
    /* Interactive CSS Micro-Animations */
    .interactive-pill {
      transition: all 0.2s ease-in-out;
      cursor: default;
    }
    .interactive-pill:hover {
      fill: #1C2128;
      stroke: #00E5FF;
      filter: drop-shadow(0 2px 8px rgba(0, 229, 255, 0.15));
    }
    .clickable-link {
      cursor: pointer;
      text-decoration: none;
    }
    .clickable-link:hover .pill-value {
      fill: #00E5FF;
      text-decoration: underline;
    }
    .bar-rect {
      transition: all 0.2s ease;
    }
    .mini-bar-group:hover .bar-rect {
      fill: #79FFE1;
      transform: scaleY(1.08);
      transform-origin: bottom;
    }
  </style>

  <!-- Container Canvas -->
  <rect width="600" height="280" rx="14" fill="#0D1117" stroke="#30363D" stroke-width="1.5"/>

  <!-- Card Header -->
  <g transform="translate(30, 24)">
    <circle cx="10" cy="10" r="10" fill="#161B22" stroke="#00E5FF" stroke-width="1.5"/>
    <path d="M7 10 L9.5 12.5 L13.5 7.5" stroke="#00E5FF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="28" y="15" class="card-title">Weekly Contribution Activity</text>
    <rect x="460" y="2" width="80" height="20" rx="10" fill="#161B22" stroke="#30363D"/>
    <text x="500" y="16" text-anchor="middle" class="card-badge">Last 7 Days</text>
  </g>

  <!-- 2x2 Grid of Interactive Stat Pill Chips -->
  
  <!-- Pill 1 (Top-Left): Weekly Velocity -->
  <g transform="translate(30, 60)" class="interactive-pill">
    <title>Total commits logged over the past 7 days across all repositories</title>
    <rect width="260" height="46" rx="10" fill="#161B22" stroke="#30363D" stroke-width="1"/>
    <text x="14" y="20" class="pill-label">🔥 Weekly Velocity</text>
    <text x="14" y="36" class="pill-value"><tspan class="pill-accent">23</tspan> commits <tspan fill="#8B949E" font-size="12">(1 repos)</tspan></text>
  </g>

  <!-- Pill 2 (Top-Right): Most Active Project (Clickable SVG Link) -->
  <a xlink:href="https://github.com/Kimobest/Kimobest" target="_blank" class="clickable-link">
    <g transform="translate(310, 60)" class="interactive-pill">
      <title>Click to open most active repository: Kimobest (23 commits)</title>
      <rect width="260" height="46" rx="10" fill="#161B22" stroke="#30363D" stroke-width="1"/>
      <text x="14" y="20" class="pill-label">⭐ Most Active Project ↗</text>
      <text x="14" y="36" class="pill-value">Kimobest <tspan fill="#8B949E" font-size="12">(23 commits)</tspan></text>
    </g>
  </a>

  <!-- Pill 3 (Bottom-Left): Current Streak -->
  <g transform="translate(30, 114)" class="interactive-pill">
    <title>Continuous unbroken contribution streak</title>
    <rect width="260" height="46" rx="10" fill="#161B22" stroke="#30363D" stroke-width="1"/>
    <text x="14" y="20" class="pill-label">🌱 Current Streak</text>
    <text x="14" y="36" class="pill-value"><tspan class="pill-accent">0</tspan> days <tspan fill="#8B949E" font-size="12">(Longest: 2d)</tspan></text>
  </g>

  <!-- Pill 4 (Bottom-Right): Peak Productivity -->
  <g transform="translate(310, 114)" class="interactive-pill">
    <title>Day of the week with the highest recorded commit volume</title>
    <rect width="260" height="46" rx="10" fill="#161B22" stroke="#30363D" stroke-width="1"/>
    <text x="14" y="20" class="pill-label">🕐 Peak Productivity</text>
    <text x="14" y="36" class="pill-value">Sat <tspan fill="#8B949E" font-size="12">(25 commits)</tspan></text>
  </g>

  <!-- 7-Day Mini Bar Graph -->
  
        <g class="mini-bar-group">
          <title>Wed, 2026-08-19: 0 commits</title>
          <rect x="30" y="186" width="66" height="36" rx="4" fill="#161B22" opacity="0.6"/>
          <rect x="30" y="219" width="66" height="3" rx="3" fill="#21262D" class="bar-rect"/>
          <text x="63.0" y="238" text-anchor="middle" class="bar-label">Wed</text>
          <text x="63.0" y="182" text-anchor="middle" class="bar-val-label">-</text>
        </g>
        <g class="mini-bar-group">
          <title>Thu, 2026-08-20: 0 commits</title>
          <rect x="109" y="186" width="66" height="36" rx="4" fill="#161B22" opacity="0.6"/>
          <rect x="109" y="219" width="66" height="3" rx="3" fill="#21262D" class="bar-rect"/>
          <text x="142.0" y="238" text-anchor="middle" class="bar-label">Thu</text>
          <text x="142.0" y="182" text-anchor="middle" class="bar-val-label">-</text>
        </g>
        <g class="mini-bar-group">
          <title>Fri, 2026-08-21: 0 commits</title>
          <rect x="188" y="186" width="66" height="36" rx="4" fill="#161B22" opacity="0.6"/>
          <rect x="188" y="219" width="66" height="3" rx="3" fill="#21262D" class="bar-rect"/>
          <text x="221.0" y="238" text-anchor="middle" class="bar-label">Fri</text>
          <text x="221.0" y="182" text-anchor="middle" class="bar-val-label">-</text>
        </g>
        <g class="mini-bar-group">
          <title>Sat, 2026-08-22: 25 commits</title>
          <rect x="267" y="186" width="66" height="36" rx="4" fill="#161B22" opacity="0.6"/>
          <rect x="267" y="186" width="66" height="36" rx="3" fill="#79FFE1" class="bar-rect"/>
          <text x="300.0" y="238" text-anchor="middle" class="bar-label">Sat</text>
          <text x="300.0" y="182" text-anchor="middle" class="bar-val-label">25</text>
        </g>
        <g class="mini-bar-group">
          <title>Sun, 2026-08-23: 0 commits</title>
          <rect x="346" y="186" width="66" height="36" rx="4" fill="#161B22" opacity="0.6"/>
          <rect x="346" y="219" width="66" height="3" rx="3" fill="#21262D" class="bar-rect"/>
          <text x="379.0" y="238" text-anchor="middle" class="bar-label">Sun</text>
          <text x="379.0" y="182" text-anchor="middle" class="bar-val-label">-</text>
        </g>
        <g class="mini-bar-group">
          <title>Mon, 2026-08-24: 0 commits</title>
          <rect x="425" y="186" width="66" height="36" rx="4" fill="#161B22" opacity="0.6"/>
          <rect x="425" y="219" width="66" height="3" rx="3" fill="#21262D" class="bar-rect"/>
          <text x="458.0" y="238" text-anchor="middle" class="bar-label">Mon</text>
          <text x="458.0" y="182" text-anchor="middle" class="bar-val-label">-</text>
        </g>
        <g class="mini-bar-group">
          <title>Tue, 2026-08-25: 0 commits</title>
          <rect x="504" y="186" width="66" height="36" rx="4" fill="#161B22" opacity="0.6"/>
          <rect x="504" y="219" width="66" height="3" rx="3" fill="#21262D" class="bar-rect"/>
          <text x="537.0" y="238" text-anchor="middle" class="bar-label">Tue</text>
          <text x="537.0" y="182" text-anchor="middle" class="bar-val-label">-</text>
        </g>

  <!-- Milestone Footer Chip -->
  <g transform="translate(30, 252)">
    <circle cx="6" cy="6" r="4" fill="#00E5FF"/>
    <text x="16" y="10" class="milestone-text">📦 <tspan font-weight="600">Milestone:</tspan> Created 1 new repository</text>
  </g>

</svg>