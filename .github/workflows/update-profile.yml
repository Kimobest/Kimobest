name: Auto-Update Contribution Activity & Profile

on:
  schedule:
    # Runs daily at midnight UTC to refresh weekly digest and metrics
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "partials/**"
      - "scripts/**"
      - ".github/workflows/update-profile.yml"

permissions:
  contents: write

jobs:
  update-activity-digest:
    name: Generate Digest & Metrics
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 1. Generate Custom SVG Stats Card
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: Kimobest
          STATS_OUTPUT_PATH: assets/github-stats.svg
        run: |
          python scripts/generate_stats.py

      - name: 2. Assemble README from Partials
        env:
          PARTIALS_DIR: partials
          README_OUTPUT_PATH: README.md
        run: |
          python scripts/build_readme.py

      - name: 3. Compute Weekly Activity Highlights & Inject Digest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: Kimobest
          TARGET_README_PATH: README.md
          TARGET_PARTIAL_PATH: partials/05_timeline.md
        run: |
          python scripts/contribution_digest.py

      - name: 4. Commit & Push Updates (Idempotent Diff Check)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/github-stats.svg partials/05_timeline.md README.md
          
          if git diff --staged --quiet; then
            echo "[*] No changes detected in metrics or digest. Skipping commit."
          else
            echo "[*] Changes detected. Committing and pushing updates..."
            git commit -m "chore: update contribution activity [skip ci]"
            git push
          fi
